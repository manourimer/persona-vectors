[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-vectors"
version = "0.1.0"
description = "Persona vectors as a psychometric instrument for moral character in LLMs"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "datasets>=2.14",
    "huggingface-hub>=0.20",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# modal: open-source model annotation via Modal/vLLM (primary annotation path)
modal = [
    "modal>=0.60",
]
# annotation: Anthropic API fallback (not required for the default Modal path)
annotation = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
